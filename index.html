<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ASM70 Analytics Pro - Scouting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; overscroll-behavior: none; }
        .stat-btn { transition: all 0.1s; touch-action: manipulation; }
        .stat-btn:active { transform: scale(0.9); }
        .quarter-active { background-color: #f97316 !important; color: white !important; border-color: #f97316 !important; }
        .chart-container { position: relative; width: 100%; height: 280px; max-height: 300px; }
        .card-shadow { box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        input[type="text"] { border-bottom: 2px solid transparent; transition: border-color 0.3s; }
        input[type="text"]:focus { border-color: #f97316; outline: none; }
    </style>
</head>
<body class="text-slate-900 pb-10">

    <header class="bg-slate-950 text-white sticky top-0 z-50 border-b-2 border-orange-600">
        <div class="max-w-[1600px] mx-auto px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <div class="bg-orange-600 px-4 py-1 rounded text-2xl font-black italic tracking-tighter">ASM70</div>
                <div class="h-8 w-[2px] bg-slate-800 hidden md:block"></div>
                <div class="flex flex-col">
                    <span class="text-[10px] text-slate-500 font-bold uppercase tracking-widest leading-none mb-1">Live Scouting</span>
                    <input type="text" id="guestNameInput" value="SQUADRA OSPITE" placeholder="NOME OSPITE" 
                           oninput="updateGuestLabel()" class="bg-transparent text-xl font-bold p-0 uppercase text-orange-500 w-48">
                </div>
            </div>

            <div class="flex items-center gap-8 bg-slate-900 px-6 py-3 rounded-2xl border border-slate-800 shadow-inner">
                <div class="text-center">
                    <span class="text-[10px] text-orange-500 font-bold uppercase block">ASM70</span>
                    <div id="scoreASM" class="text-4xl font-black tabular-nums">0</div>
                </div>
                <div class="text-slate-600 font-bold text-2xl italic">VS</div>
                <div class="text-center">
                    <span id="guestLabelDisplay" class="text-[10px] text-slate-500 font-bold uppercase block">OSPITI</span>
                    <div class="flex items-center gap-3">
                        <button onclick="updateManualGuest(-1)" class="w-8 h-8 rounded-lg bg-slate-800 text-sm font-bold hover:bg-slate-700">-</button>
                        <div id="scoreGuest" class="text-4xl font-black tabular-nums">0</div>
                        <button onclick="updateManualGuest(1)" class="w-8 h-8 rounded-lg bg-slate-700 text-sm font-bold hover:bg-orange-600">+</button>
                    </div>
                </div>
            </div>

            <div class="flex bg-slate-900 p-1 rounded-xl border border-slate-800">
                <button onclick="setQuarter(1)" id="q1-btn" class="quarter-btn px-4 py-2 rounded-lg text-xs font-bold transition-all quarter-active">Q1</button>
                <button onclick="setQuarter(2)" id="q2-btn" class="quarter-btn px-4 py-2 rounded-lg text-xs font-bold transition-all">Q2</button>
                <button onclick="setQuarter(3)" id="q3-btn" class="quarter-btn px-4 py-2 rounded-lg text-xs font-bold transition-all">Q3</button>
                <button onclick="setQuarter(4)" id="q4-btn" class="quarter-btn px-4 py-2 rounded-lg text-xs font-bold transition-all">Q4</button>
            </div>
        </div>
    </header>

    <main class="max-w-[1600px] mx-auto px-4 py-6 grid lg:grid-cols-12 gap-6">
        <aside class="lg:col-span-3 space-y-6">
            <div class="bg-white rounded-3xl p-6 border border-slate-200 card-shadow">
                <h3 class="text-xs font-black uppercase text-slate-400 mb-4 tracking-widest italic">Inserimento Roster</h3>
                <div class="flex gap-2 mb-4">
                    <input type="text" id="newPlayerName" placeholder="Nome giocatore..." class="flex-1 text-sm bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none">
                    <button onclick="addPlayer()" class="bg-slate-950 text-white px-5 rounded-xl font-bold hover:bg-orange-600 shadow-lg">+</button>
                </div>
                <div id="rosterList" class="space-y-2 max-h-48 overflow-y-auto custom-scrollbar pr-1"></div>
            </div>

            <div class="bg-white rounded-3xl p-6 border border-slate-200 card-shadow">
                <h3 class="text-xs font-black uppercase text-slate-400 mb-4 tracking-widest">Efficienza (EFF) Live</h3>
                <div class="chart-container"><canvas id="efficiencyChart"></canvas></div>
            </div>

            <div class="bg-slate-900 rounded-3xl p-6 text-white shadow-xl">
                <h3 class="text-xs font-black uppercase text-orange-500 mb-6 tracking-widest">Opzioni Match</h3>
                <div class="space-y-3">
                    <button onclick="resetCurrentMatch()" class="w-full bg-slate-800 hover:bg-red-900/60 text-slate-400 py-3 rounded-2xl font-bold text-xs transition-all border border-slate-700">AZZERA STATS ATTUALI</button>
                    <p class="text-[10px] text-slate-500 text-center italic">I dati si salvano automaticamente ad ogni click.</p>
                </div>
            </div>
        </aside>

        <div class="lg:col-span-9 space-y-6">
            <div class="bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden">
                <div class="p-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                    <span class="text-[10px] font-black uppercase text-slate-400">Tabellino Dinamico</span>
                    <div class="flex gap-4">
                        <div class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-orange-600"></span> <span class="text-[10px] font-bold">2PT</span></div>
                        <div class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-blue-600"></span> <span class="text-[10px] font-bold">3PT</span></div>
                        <div class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-slate-800"></span> <span class="text-[10px] font-bold">TL</span></div>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse min-w-[1100px]">
                        <thead>
                            <tr class="bg-slate-50 text-[10px] uppercase font-bold text-slate-500 border-b border-slate-100">
                                <th class="px-6 py-5">Giocatore</th><th class="px-2 py-5 text-center">Tiro da 2</th><th class="px-2 py-5 text-center">Tiro da 3</th><th class="px-2 py-5 text-center">Liberi</th><th class="px-2 py-5 text-center">R / A</th><th class="px-2 py-5 text-center">P / F</th><th class="px-6 py-5 text-center bg-slate-900 text-white">EFF</th>
                            </tr>
                        </thead>
                        <tbody id="statsBody" class="divide-y divide-slate-50"></tbody>
                    </table>
                </div>
                <div id="emptyMsg" class="p-20 text-center text-slate-300 hidden"><div class="text-4xl mb-2 opacity-20">🏀</div><p class="italic text-lg font-light uppercase tracking-widest">Roster vuoto</p></div>
            </div>
        </div>
    </main>

    <script>
        let roster = JSON.parse(localStorage.getItem('asm70_roster_v3')) || [];
        let currentMatch = JSON.parse(localStorage.getItem('asm70_match_v3')) || {guestName:"SQUADRA OSPITE",guestScore:0,quarter:1,data:{}};
        let chart = null;
        window.onload=()=>{initQuarterData();initChart();renderAll();};
        function initQuarterData(){roster.forEach(player=>{if(!currentMatch.data[player.id])currentMatch.data[player.id]={1:emptyStats(),2:emptyStats(),3:emptyStats(),4:emptyStats()};});document.getElementById('guestNameInput').value=currentMatch.guestName;}
        function emptyStats(){return{s2:0,m2:0,s3:0,m3:0,s1:0,m1:0,r:0,a:0,p:0,f:0};}
        function setQuarter(q){currentMatch.quarter=q;document.querySelectorAll('.quarter-btn').forEach(b=>b.classList.remove('quarter-active'));document.getElementById(`q${q}-btn`).classList.add('quarter-active');renderAll();}
        function addPlayer(){const input=document.getElementById('newPlayerName'),name=input.value.trim();if(name){const id='p_'+Date.now();roster.push({id,name});currentMatch.data[id]={1:emptyStats(),2:emptyStats(),3:emptyStats(),4:emptyStats()};input.value='';save();renderAll();}}
        function removePlayer(id){if(confirm('Rimuovere il giocatore?')){roster=roster.filter(p=>p.id!==id);delete currentMatch.data[id];save();renderAll();}}
        function updateStat(pId,stat,delta){const q=currentMatch.quarter;if(!currentMatch.data[pId])initQuarterData();currentMatch.data[pId][q][stat]=Math.max(0,currentMatch.data[pId][q][stat]+delta);save();renderAll();}
        function updateGuestLabel(){const val=document.getElementById('guestNameInput').value;currentMatch.guestName=val;document.getElementById('guestLabelDisplay').innerText=val||'OSPITI';save();}
        function updateManualGuest(delta){currentMatch.guestScore=Math.max(0,currentMatch.guestScore+delta);save();renderAll();}
        function calculatePlayerTotals(pId){const d=currentMatch.data[pId];let totals=emptyStats();if(!d)return{points:0,eff:0,...totals};for(let q=1;q<=4;q++)Object.keys(totals).forEach(k=>totals[k]+=d[q][k]);const points=totals.s2*2+totals.s3*3+totals.s1,missed=totals.m2+totals.m3+totals.m1,eff=points+totals.r+totals.a-missed-totals.p-totals.f;return{points,eff,...totals};}
        function save(){localStorage.setItem('asm70_roster_v3',JSON.stringify(roster));localStorage.setItem('asm70_match_v3',JSON.stringify(currentMatch));}
        function renderAll(){const body=document.getElementById('statsBody'),rosterEl=document.getElementById('rosterList'),empty=document.getElementById('emptyMsg');rosterEl.innerHTML=roster.map(p=>`<div class="flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-100 group"><span class="text-sm font-bold text-slate-700">${p.name}</span><button onclick="removePlayer('${p.id}')" class="text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 text-xs font-black">X</button></div>`).join('');if(!roster.length){empty.classList.remove('hidden');body.innerHTML='';}else{empty.classList.add('hidden');body.innerHTML=roster.map(p=>{const qData=currentMatch.data[p.id][currentMatch.quarter],t=calculatePlayerTotals(p.id);return`<tr class="hover:bg-slate-50/50"><td class="px-6 py-4"><div class="text-sm font-black text-slate-800 uppercase">${p.name}</div><div class="text-[10px] text-orange-600 font-bold">TOT PT: ${t.points}</div></td><td class="px-2 py-4"><div class="flex flex-col items-center gap-1"><div class="flex gap-1"><div class="flex flex-col gap-1"><button onclick="updateStat('${p.id}','s2',1)" class="stat-btn bg-orange-600 text-white w-10 h-10 rounded-xl text-[10px] font-black">SEG</button><button onclick="updateStat('${p.id}','s2',-1)" class="stat-btn bg-orange-100 text-orange-800 w-10 h-5 rounded-lg text-[9px] font-bold">-</button></div><div class="flex flex-col gap-1"><button onclick="updateStat('${p.id}','m2',1)" class="stat-btn bg-slate-300 text-white w-10 h-10 rounded-xl text-[10px] font-black">ERR</button><button onclick="updateStat('${p.id}','m2',-1)" class="stat-btn bg-slate-100 text-slate-400 w-10 h-5 rounded-lg text-[9px] font-bold">-</button></div></div><div class="text-[10px] font-black text-slate-400">${qData.s2} / ${qData.m2}</div></div></td><td class="px-2 py-4"><div class="flex flex-col items-center gap-1"><div class="flex gap-1"><div class="flex flex-col gap-1"><button onclick="updateStat('${p.id}','s3',1)" class="stat-btn bg-blue-600 text-white w-10 h-10 rounded-xl text-[10px] font-black">SEG</button><button onclick="updateStat('${p.id}','s3',-1)" class="stat-btn bg-blue-100 text-blue-800 w-10 h-5 rounded-lg text-[9px] font-bold">-</button></div><div class="flex flex-col gap-1"><button onclick="updateStat('${p.id}','m3',1)" class="stat-btn bg-slate-300 text-white w-10 h-10 rounded-xl text-[10px] font-black">ERR</button><button onclick="updateStat('${p.id}','m3',-1)" class="stat-btn bg-slate-100 text-slate-400 w-10 h-5 rounded-lg text-[9px] font-bold">-</button></div></div><div class="text-[10px] font-black text-slate-400">${qData.s3} / ${qData.m3}</div></div></td><td class="px-2 py-4"><div class="flex flex-col items-center gap-1"><div class="flex gap-1"><div class="flex flex-col gap-1"><button onclick="updateStat('${p.id}','s1',1)" class="stat-btn bg-slate-800 text-white w-10 h-10 rounded-xl text-[10px] font-black">SEG</button><button onclick="updateStat('${p.id}','s1',-1)" class="stat-btn bg-slate-200 text-slate-600 w-10 h-5 rounded-lg text-[9px] font-bold">-</button></div><div class="flex flex-col gap-1"><button onclick="updateStat('${p.id}','m1',1)" class="stat-btn bg-slate-200 text-slate-400 w-10 h-10 rounded-xl text-[10px] font-black border border-slate-300">ERR</button><button onclick="updateStat('${p.id}','m1',-1)" class="stat-btn bg-slate-50 text-slate-300 w-10 h-5 rounded-lg text-[9px] font-bold">-</button></div></div><div class="text-[10px] font-black text-slate-400">${qData.s1} / ${qData.m1}</div></div></td><td class="px-2 py-4"><div class="flex gap-2 justify-center"><div class="flex flex-col items-center"><button onclick="updateStat('${p.id}','r',1)" class="stat-btn bg-slate-100 hover:bg-orange-100 w-10 h-10 rounded-xl font-black text-sm border">R</button><button onclick="updateStat('${p.id}','r',-1)" class="text-[9px] font-bold text-slate-300 mt-1">-1</button><span class="text-[10px] font-black text-orange-600">${qData.r}</span></div><div class="flex flex-col items-center"><button onclick="updateStat('${p.id}','a',1)" class="stat-btn bg-slate-100 hover:bg-blue-100 w-10 h-10 rounded-xl font-black text-sm border">A</button><button onclick="updateStat('${p.id}','a',-1)" class="text-[9px] font-bold text-slate-300 mt-1">-1</button><span class="text-[10px] font-black text-blue-600">${qData.a}</span></div></div></td><td class="px-2 py-4"><div class="flex gap-2 justify-center"><div class="flex flex-col items-center"><button onclick="updateStat('${p.id}','p',1)" class="stat-btn bg-red-50 text-red-600 w-10 h-10 rounded-xl font-black text-sm border border-red-100">P</button><button onclick="updateStat('${p.id}','p',-1)" class="text-[9px] font-bold text-slate-300 mt-1">-1</button><span class="text-[10px] font-black text-red-600">${qData.p}</span></div><div class="flex flex-col items-center"><button onclick="updateStat('${p.id}','f',1)" class="stat-btn ${qData.f>=4?'bg-red-600 text-white':'bg-slate-200 text-slate-600'} w-10 h-10 rounded-xl font-black text-sm border">F</button><button onclick="updateStat('${p.id}','f',-1)" class="text-[9px] font-bold text-slate-300 mt-1">-1</button><span class="text-[10px] font-black ${qData.f>=4?'text-red-600':'text-slate-400'}">${qData.f}</span></div></div></td><td class="px-6 py-4 text-center bg-slate-950 text-orange-500 font-black text-2xl italic">${t.eff}</td></tr>`;}).join('');}updateGlobalStats();if(chart)updateChartData();}
        function updateGlobalStats(){let totalPoints=0;roster.forEach(p=>totalPoints+=calculatePlayerTotals(p.id).points);document.getElementById('scoreASM').innerText=totalPoints;document.getElementById('scoreGuest').innerText=currentMatch.guestScore;}
        function initChart(){const ctx=document.getElementById('efficiencyChart').getContext('2d');chart=new Chart(ctx,{type:'bar',data:{labels:[],datasets:[{label:'EFF',data:[],backgroundColor:'#f97316',borderRadius:6}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,ticks:{font:{size:9}}},y:{ticks:{font:{size:10,weight:'bold'}}}}}});}
        function updateChartData(){chart.data.labels=roster.map(p=>p.name.toUpperCase());chart.data.datasets[0].data=roster.map(p=>calculatePlayerTotals(p.id).eff);chart.update();}
        function resetCurrentMatch(){if(confirm('Azzerare tutte le statistiche del match attuale?')){currentMatch.guestScore=0;currentMatch.quarter=1;roster.forEach(p=>currentMatch.data[p.id]={1:emptyStats(),2:emptyStats(),3:emptyStats(),4:emptyStats()});save();renderAll();}}
    </script>
</body>
</html>
