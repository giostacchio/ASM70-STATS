name: Keep Supabase alive

on:
  schedule:
    - cron: '17 6 */3 * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping ASM70 Supabase database
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 10 \
            -H "apikey: sb_publishable_W1Ygs4iWPPv8UUTtjUMetA_TA14SEc-" \
            -H "Accept: application/json" \
            "https://gtiescrhzsctcyfjuixq.supabase.co/rest/v1/team_settings?select=id&limit=1" \
            >/dev/null
          echo "Supabase ASM70 raggiungibile"
