<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f172a">
<title>ASM70 U14 · Recupero password</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#eef2f7;color:#142033}.wrap{max-width:560px;margin:40px auto;padding:14px}.card{background:#fff;border:1px solid #dde5ee;border-radius:18px;padding:20px;box-shadow:0 8px 30px #0f172a12}h1{margin:0 0 8px;font-size:28px}.mut{color:#68768a}.ok{color:#166534}.err{color:#b91c1c}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}label{display:block;font-size:12px;font-weight:800;margin:14px 0 5px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cdd7e3;border-radius:10px;font-size:16px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.blue{background:#155eef;color:white}.secondary{background:#e8eef8;color:#142033}.hidden{display:none!important}a{color:#155eef;font-weight:700;text-decoration:none}
</style>
</head>
<body><div class="wrap"><div class="card">
<h1>Recupero password U14</h1>
<p class="mut">Usa questa pagina se l'Admin dice che la password non è valida.</p>
<section id="requestBox">
<label>Email</label><input id="email" type="email" autocomplete="email" placeholder="nome@email.it">
<div class="row"><button id="send" class="btn blue">Invia email di recupero</button><a class="btn secondary" href="admin.html">Torna all'Admin</a></div>
</section>
<section id="changeBox" class="hidden">
<label>Nuova password</label><input id="p1" type="password" autocomplete="new-password" minlength="8">
<label>Ripeti nuova password</label><input id="p2" type="password" autocomplete="new-password" minlength="8">
<div class="row"><button id="change" class="btn blue">Salva nuova password</button></div>
</section>
<p id="msg" class="mut"></p>
</div></div>
<script>
const BASE='https://gtiescrhzsctcyfjuixq.supabase.co';
const KEY='sb_publishable_W1Ygs4iWPPv8UUTtjUMetA_TA14SEc-';
const REDIRECT='https://giostacchio.github.io/ASM70-STATS/U14/reset-password.html';
const $=s=>document.querySelector(s);
const params=new URLSearchParams(location.hash.replace(/^#/,''));
const accessToken=params.get('access_token');
const type=params.get('type');
if(accessToken && type==='recovery'){
  $('#requestBox').classList.add('hidden');
  $('#changeBox').classList.remove('hidden');
  $('#msg').textContent='Link verificato. Scegli ora una nuova password.';
}
$('#send').onclick=async()=>{
  const email=$('#email').value.trim();
  if(!email){$('#msg').className='err';$('#msg').textContent='Inserisci la tua email.';return}
  $('#send').disabled=true;$('#msg').className='mut';$('#msg').textContent='Invio in corso…';
  try{
    const r=await fetch(BASE+'/auth/v1/recover?redirect_to='+encodeURIComponent(REDIRECT),{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},body:JSON.stringify({email})});
    let j={};try{j=await r.json()}catch(e){}
    if(!r.ok) throw new Error(j.error_description||j.msg||j.message||('HTTP '+r.status));
    $('#msg').className='ok';$('#msg').textContent='Email inviata. Apri il messaggio di Supabase e premi il link di recupero.';
  }catch(e){$('#msg').className='err';$('#msg').textContent='Errore: '+e.message}
  finally{$('#send').disabled=false}
};
$('#change').onclick=async()=>{
  const p1=$('#p1').value,p2=$('#p2').value;
  if(p1.length<8){$('#msg').className='err';$('#msg').textContent='La password deve avere almeno 8 caratteri.';return}
  if(p1!==p2){$('#msg').className='err';$('#msg').textContent='Le due password non coincidono.';return}
  $('#change').disabled=true;$('#msg').className='mut';$('#msg').textContent='Aggiornamento in corso…';
  try{
    const r=await fetch(BASE+'/auth/v1/user',{method:'PUT',headers:{'apikey':KEY,'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({password:p1})});
    let j={};try{j=await r.json()}catch(e){}
    if(!r.ok) throw new Error(j.error_description||j.msg||j.message||('HTTP '+r.status));
    history.replaceState(null,'',location.pathname);
    $('#changeBox').classList.add('hidden');
    $('#msg').className='ok';$('#msg').innerHTML='Password aggiornata. <a href="admin.html">Apri ora l\'Admin U14</a>.';
  }catch(e){$('#msg').className='err';$('#msg').textContent='Errore: '+e.message}
  finally{$('#change').disabled=false}
};
</script></body></html>
