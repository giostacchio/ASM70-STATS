</style></head><body><div class="app"><section id="login" class="card" style="max-width:520px;margin:45px auto"><h2>Accesso responsabile U14</h2><p class="mut">Accedi con l'email e la password che hai già registrato e confermato in Supabase.</p><label>Email</label><input id="email" type="email"><label style="margin-top:8px">Password</label><input id="pwd" type="password"><div class="row" style="margin-top:10px"><button class="btn blue" id="signin">Accedi</button></div><p class="mut" id="msg">Admin v4 REST: pronto.</p></section><div id="panel" class="hidden"><header class="hero"><div class="row"><div><h1 id="title" style="margin:0">ASM70 U14</h1><div>Gestione calendario, convocati e risultati</div></div><div><button class="btn" id="newGame">+ Partita</button> <button class="btn" id="logout">Esci</button></div></div></header><div class="grid"><section class="card"><div class="row"><h2>Partite</h2><button class="btn blue" id="newGame2">+ Nuova</button></div><div class="list" id="games"></div></section><aside><section class="card"><div class="row"><h2>Roster</h2><button class="btn blue" id="newPlayer">+ Ragazzo</button></div><div class="list" id="players"></div></section></aside></div></div></div>

<script>
function createLiteClient(BASE, KEY){
  const SK='u14_lite_session_v1';
  let session=null;
  try{session=JSON.parse(localStorage.getItem(SK)||'null')}catch(e){}
  const h=(auth=true)=>({'apikey':KEY,'Content-Type':'application/json',...(auth&&session?.access_token?{'Authorization':'Bearer '+session.access_token}:{})});
  async function refresh(){
    if(!session?.refresh_token) return false;
    try{
      const r=await fetch(BASE+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:h(false),body:JSON.stringify({refresh_token:session.refresh_token}),cache:'no-store'});
      if(!r.ok)return false; session=await r.json(); localStorage.setItem(SK,JSON.stringify(session)); return true;
    }catch(e){return false}
  }
  async function req(url,opt={},retry=true){
    let r=await fetch(BASE+url,{...opt,headers:{...h(true),...(opt.headers||{})},cache:'no-store'});
    if(r.status===401&&retry&&await refresh()) return req(url,opt,false);
    return r;
  }
  class Q{
    constructor(table){this.table=table;this.mode='select';this.filters=[];this.orders=[];this.cols='*';this.payload=null;this.one=false;}
    select(c='*'){this.cols=c;return this}
    eq(k,v){this.filters.push([k,v]);return this}
    order(k,o={}){this.orders.push([k,o.ascending!==false]);return this}
    single(){this.one=true;return this}
    update(x){this.mode='update';this.payload=x;return this}
    insert(x){this.mode='insert';this.payload=x;return this}
    delete(){this.mode='delete';return this}
    then(ok,ko){return this.run().then(ok,ko)}
    async run(){
      try{
        let qs=[]; if(this.cols)qs.push('select='+encodeURIComponent(this.cols));
        this.filters.forEach(([k,v])=>qs.push(encodeURIComponent(k)+'=eq.'+encodeURIComponent(v)));
        if(this.orders.length)qs.push('order='+this.orders.map(([k,a])=>encodeURIComponent(k)+'.'+(a?'asc':'desc')).join(','));
        let url='/rest/v1/'+this.table+(qs.length?'?'+qs.join('&'):'');
        let opt={method:'GET'}, prefer='';
        if(this.mode==='update'){opt.method='PATCH';opt.body=JSON.stringify(this.payload);prefer=this.cols?'return=representation':'return=minimal'}
        else if(this.mode==='insert'){opt.method='POST';opt.body=JSON.stringify(this.payload);prefer=this.cols?'return=representation':'return=minimal'}
        else if(this.mode==='delete'){opt.method='DELETE';prefer='return=minimal'}
        if(prefer)opt.headers={'Prefer':prefer};
        const r=await req(url,opt);
        if(!r.ok){let er={message:'HTTP '+r.status};try{er=await r.json()}catch(e){};return {data:null,error:{message:er.message||er.msg||er.error_description||('HTTP '+r.status)}}}
        if(r.status===204)return {data:null,error:null};
        const t=await r.text();let data=t?JSON.parse(t):null;
        if(this.one&&Array.isArray(data))data=data[0]??null;
        return {data,error:null};
      }catch(e){return {data:null,error:{message:e.message||String(e)}}}
    }
  }
  return {
    auth:{
      async signInWithPassword({email,password}){
        try{const r=await fetch(BASE+'/auth/v1/token?grant_type=password',{method:'POST',headers:h(false),body:JSON.stringify({email,password}),cache:'no-store'});const j=await r.json();if(!r.ok)return {data:null,error:{message:j.error_description||j.msg||j.message||'Accesso non riuscito'}};session=j;localStorage.setItem(SK,JSON.stringify(j));return {data:{session:j,user:j.user},error:null}}catch(e){return {data:null,error:{message:e.message}}}
      },
      async getUser(){
        if(!session?.access_token)return {data:{user:null},error:{message:'No session'}};
        try{let r=await req('/auth/v1/user',{method:'GET'});if(!r.ok)return {data:{user:null},error:{message:'Sessione non valida'}};return {data:{user:await r.json()},error:null}}catch(e){return {data:{user:null},error:{message:e.message}}}
      },
      async signOut(){session=null;localStorage.removeItem(SK);return {error:null}},
      onAuthStateChange(){return {data:{subscription:{unsubscribe(){}}}}}
    },
    from(t){return new Q(t)},
    rpc(name,args={}){return (async()=>{try{const r=await req('/rest/v1/rpc/'+name,{method:'POST',body:JSON.stringify(args)});if(!r.ok){let j={};try{j=await r.json()}catch(e){};return {data:null,error:{message:j.message||('HTTP '+r.status)}}}const x=await r.text();return {data:x?JSON.parse(x):null,error:null}}catch(e){return {data:null,error:{message:e.message}}}})()}
  }
}
</script>
